name: doc

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # don't publish a doc if the tests fail
      - run: cargo test

      # -D warnings: a broken doc (like an unclosed ``` block) fails the build
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # cargo doc has no pages at the root: redirect the crate page
      - run: echo '<meta http-equiv="refresh" content="0; url=xapi_logs/index.html">' > target/doc/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
